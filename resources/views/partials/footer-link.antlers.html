<script>
(function () {
  function themeReveal() {
    if (!document.body || document.body.classList.contains("is-ready")) return;
    document.body.classList.add("is-ready");
    document.body.classList.remove("no-scroll", "overflow-hidden");
    var pre = document.querySelector(".preloader");
    if (pre) {
      pre.style.opacity = "0";
      pre.style.pointerEvents = "none";
      setTimeout(function () { pre.style.display = "none"; pre.classList.add("hidden"); }, 250);
    }
  }
  if (document.readyState === "complete") themeReveal();
  else window.addEventListener("load", themeReveal);
  setTimeout(themeReveal, 1200);
})();
</script>
